name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install development dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git libncurses-dev python3 qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window qml6-module-qtquick-templates
      - name: Build and test
        env:
          AI_SIM_BUILD_DIR: build
          AI_SIM_BUILD_JOBS: '2'
          PYTHONDONTWRITEBYTECODE: '1'
        run: bash "Development Tools/scripts/build-and-run.sh" test
      - name: Build and test Qt workstation
        env:
          AI_SIM_BUILD_JOBS: '2'
        run: bash "Development Tools/scripts/build-gui.sh" test
