name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install development dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git libncurses-dev python3
      - name: Build and test
        env:
          AI_SIM_BUILD_DIR: build
          AI_SIM_BUILD_JOBS: '2'
          PYTHONDONTWRITEBYTECODE: '1'
        run: bash "Development Tools/scripts/build-and-run.sh" test
