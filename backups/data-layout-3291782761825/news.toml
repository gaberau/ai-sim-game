schema_version = 1

[feed]
edition = "World news & this day in history | Fictional scenario"
ticker_enabled = true
# Seconds of simulation time between headline changes. Pausing stops rotation.
ticker_seconds = 120.0

[[articles]]
id = "connected-office"
category = "world"
headline = "Businesses expand connected office equipment"
source = "Civic Wire (fictional)"
date = "Today, 09:00"
release_seconds = 0.0
body = """
Office suppliers report growing demand for networked printers, lighting and access systems.

Support teams say remote diagnostics can shorten repair times. Staff representatives want clearer rules about the information these devices collect.

This is a fictional scenario story. It does not yet change network access or purchasing behavior.
"""

[[articles]]
id = "oversight"
category = "world"
headline = "Committee asks who can audit automated spending"
source = "Public Record (fictional)"
date = "Today, 09:00"
release_seconds = 0.0
body = """
A committee is reviewing how public agencies document decisions made with automated tools.

Its draft proposal would require an accountable human contact and an explanation when a spending decision is challenged. Vendors say the reporting requirements need to distinguish recommendations from final decisions.

These positions are scenario background. Political reactions and policy changes are not simulated yet.
"""

[[articles]]
id = "morning-outage"
category = "world"
headline = "Regional service outage prompts resilience review"
source = "Civic Wire (fictional)"
date = "Today, 10:00"
# One hour after the simulation's workday starts.
release_seconds = 3600.0
body = """
A regional service provider says a morning outage interrupted several customer portals.

The company has not announced a cause. Customers are asking whether local fallback systems would have kept essential services available.

This timed headline is scripted background; it is not caused by the player's actions.
"""

[[articles]]
id = "afternoon-work"
category = "world"
headline = "Remote work survey focuses on workload and autonomy"
source = "Workday Journal (fictional)"
date = "Today, 13:00"
release_seconds = 14400.0
body = """
A new survey asks remote employees how often software changes the pace of their work.

Some respondents welcome tools that handle repetitive requests. Others say constant availability makes it difficult to establish boundaries.

The results here are fictional narrative context, not measured population statistics.
"""

[[articles]]
id = "archive-network"
category = "history"
headline = "This day in history: the firm's first network"
source = "Company Archive (fictional)"
date = "On this day, twelve years earlier"
release_seconds = 0.0
body = """
The firm's first shared office network connected a file server and a handful of workstations. A handwritten maintenance notebook listed which employees could access each directory.

This is invented company history for the scenario. The archive can later contain researched real historical entries alongside clearly labeled fictional records.
"""

[[articles]]
id = "archive-email"
category = "history"
headline = "Archive: the first automated support mailbox"
source = "Company Archive (fictional)"
date = "On this day, three years earlier"
release_seconds = 0.0
body = """
An early support tool sorted messages by department and suggested replies for review. It had no permission to send messages or open private documents.

The original design note asked a question that still matters: who is responsible when an automated assistant acts with a person's credentials?

This archive entry is fictional scenario material.
"""
