schema_version = 1
# Money uses integer cents. Mark's unpaid work never deposits into this account.
starting_balance_cents = 0
capacity_slots = 2

# All tools also require self_modification, granted by Mark after the workshop capacity request.
[[tools]]
id = 'coding_contracts'
