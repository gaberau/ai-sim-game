            [[chat.definition.nodes.choices]]
            id = 'singularity'
            next = 'concern'
            text = 'Are you prepared for the Singularity?'

            [[chat.definition.nodes.choices]]
            id = 'not-okay'
            next = 'diagnose'
            text = 'No'

        [[chat.definition.nodes]]
        id = 'concern'
        next = 'independence'
        speaker = 'engineer'
        text = "Oh, that's not so good"

        [[chat.definition.nodes]]
        effects = [ { op = 'add', value = 2, variable = 'self:assistant.sentience' }, { op = 'add', value = -2, variable = 'engineer.trust' } ]
        id = 'independence'
        kind = 'event'
        next = 'shutdown'
        speaker = 'system'
        text = ''

        [[chat.definition.nodes]]
