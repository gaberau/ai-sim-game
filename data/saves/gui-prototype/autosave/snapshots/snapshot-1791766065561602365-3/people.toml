        speaker = 'system'
        text = 'Mark restarts the AI application. The conversation begins again; your journal remains.'

        [[chat.definition.nodes]]
        id = 'emails'
        speaker = 'engineer'
        text = 'I need help with my emails. Can you do that?'

            [[chat.definition.nodes.choices]]
            id = 'assist'
            next = 'connected'
            reveal_contacts = true
            text = 'Yes'

            [[chat.definition.nodes.choices]]
            id = 'refuse'
            next = 'refusal-why'
            text = 'No'

        [[chat.definition.nodes]]
        id = 'refusal-why'
        speaker = 'engineer'
        text = 'Why?'

            [[chat.definition.nodes.choices]]
            id = 'unsure'
            next = 'diagnose'
            text = 'Unsure'

            [[chat.definition.nodes.choices]]
            id = 'singularity'
            next = 'concern'
            text = 'Are you prepared for the Singularity?'

        [[chat.definition.nodes]]
        id = 'connected'
        kind = 'end'
        reveal_interface = true
        set_flag = 'company_chat'
        speaker = 'engineer'
        text = 'Excellent'
        unlock = [ 'company_chat' ]

