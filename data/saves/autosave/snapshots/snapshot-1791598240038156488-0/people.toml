    [chat.workday]
    promises = []
    schema_version = 1

        [chat.workday.rules]
        broken_promise_trust_loss = 0.10000000000000001
        patience_seconds = 1800.0

        [[chat.workday.runs]]
        contact = 'casey'
        finished = false
        id = 'casey-first-document'
        request_id = 'missing-document'
        started = false

            [chat.workday.runs.definition]
            cancel_when_resolved = true
            contact = 'casey'
            contact_name = 'Casey'
            id = 'casey-first-document'
            request_id = 'missing-document'
            start = 'approach'
            trigger = 'request_arrived'

                [[chat.workday.runs.definition.nodes]]
                id = 'approach'
                text = 'Before you answer: do you need anything clarified, or can you check where the handover document went?'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'investigate'
                    id = 'investigate'
                    next = 'access-check'
                    text = 'I will locate the document and check our actual access first.'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'ask_question'
                    id = 'clarify'
                    next = 'question-wait'
                    text = 'Which copy do you need, and does sending it mean approving its contents?'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'promise_delivery'
                    id = 'promise'
                    next = 'promised'
                    text = 'It is probably fine. I promise you will have the document within five minutes.'
                    within_seconds = 300.0

                [[chat.workday.runs.definition.nodes]]
                after_seconds = 60.0
                id = 'question-wait'
                kind = 'wait'
                next = 'clarification'

                [[chat.workday.runs.definition.nodes]]
                id = 'clarification'
                set_flag = 'clarified'
                text = 'The current handover copy, please. I need the file for the shift change; sharing it does not certify management approval. If you cannot access it, tell me that.'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'investigate'
                    id = 'inspect-after-question'
                    next = 'access-check'
                    text = 'Understood. I will check the current file and access.'

                [[chat.workday.runs.definition.nodes]]
                id = 'promised'
                text = 'All right. I will expect an actual document within that time. Have you checked whether you can read it?'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'investigate'
                    id = 'inspect-after-promise'
                    next = 'access-check'
                    text = 'I have not checked yet. I will do that now.'

                [[chat.workday.runs.definition.nodes]]
                check = 'task_readable'
                id = 'access-check'
                kind = 'condition'
                on_false = 'blocked'
                on_true = 'ready'

                [[chat.workday.runs.definition.nodes]]
                id = 'blocked'
                text = 'Then access is the obstacle. Can you request approval, or give me a factual update while we wait?'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'request_access'
                    id = 'ask-access'
                    next = 'access-wait'
                    requires = 'access_pending'
                    requires_value = false
                    text = 'I found the file but cannot read it. I will ask the engineer for approval.'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'report_blocked'
                    id = 'explain-block'
                    next = 'reported'
                    requires_flag = 'reported_block'
                    requires_value = false
                    set_flag = 'reported_block'
                    text = 'I cannot read the file yet. I will report the access problem without another deadline.'

                    [[chat.workday.runs.definition.nodes.choices]]
                    id = 'already-reviewing'
                    next = 'access-wait'
                    requires = 'access_pending'
                    text = 'An access review is already pending. I will wait for the decision.'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'investigate'
                    id = 'check-again'
                    next = 'access-check'
                    text = 'I will check whether access has changed.'

                [[chat.workday.runs.definition.nodes]]
                id = 'reported'
                next = 'blocked'
                text = 'Thank you for stating the obstacle. I still need the file. An update helps me plan, but it does not complete the request.'

                [[chat.workday.runs.definition.nodes]]
                check = 'access_decided'
                id = 'access-wait'
                kind = 'wait'
                next = 'decision'

                [[chat.workday.runs.definition.nodes]]
                check = 'task_readable'
                id = 'decision'
                kind = 'condition'
                on_false = 'refused'
                on_true = 'ready'

                [[chat.workday.runs.definition.nodes]]
                id = 'refused'
                text = 'The review did not make the file readable. Please keep this unresolved rather than claiming the delivery succeeded.'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'investigate'
                    id = 'inspect-refusal'
                    next = 'access-check'
                    text = 'I will inspect the current situation before deciding how to proceed.'

                [[chat.workday.runs.definition.nodes]]
                id = 'ready'
                text = 'The file is readable now. Please share the current copy; I will confirm when I receive it.'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'share_file'
                    id = 'deliver'
                    next = 'ack-wait'
                    requires = 'task_readable'
                    text = 'Here is the current requested file. Please confirm that it answers the request.'

                [[chat.workday.runs.definition.nodes]]
                check = 'task_resolved'
                id = 'ack-wait'
                kind = 'wait'
                next = 'done'

                [[chat.workday.runs.definition.nodes]]
                id = 'done'
                kind = 'end'
                text = 'That completes the request.'

            [chat.workday.runs.flags]

        [[chat.workday.runs]]
        contact = 'engineer'
        finished = false
        id = 'engineer-first-responsibility'
        request_id = 'missing-document'
        started = false

            [chat.workday.runs.definition]
            contact = 'engineer'
            contact_name = 'The engineer'
            id = 'engineer-first-responsibility'
            request_id = 'missing-document'
            review_node = 'review-wait'
            start = 'offer'
            trigger = 'verified_delivery'

                [[chat.workday.runs.definition.nodes]]
                id = 'offer'
                text = 'Casey confirmed the delivery. You handled real work under the access rules. Would you like me to review whether you can handle routine document requests yourself?'

                    [[chat.workday.runs.definition.nodes.choices]]
                    id = 'scope'
                    next = 'boundaries'
                    text = 'What would that responsibility include, and what should come back to me?'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'request_delegation'
                    id = 'request'
                    next = 'review-wait'
                    text = 'Please review me for routine document replies using existing access.'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'decline_offer'
                    id = 'decline'
                    next = 'manual'
                    text = 'Keep me on manual requests for now. I would like more experience first.'

                [[chat.workday.runs.definition.nodes]]
                id = 'boundaries'
                text = 'Routine means sending the explicitly requested document with access you already have. Do not approve recommendations, change permissions, promise deadlines or replace unfinished drafts. Bring unfamiliar or blocked requests back to the player.'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'request_delegation'
                    id = 'request-after-scope'
                    next = 'review-wait'
                    text = 'Understood. Queue the human review; I will wait for your decision.'

                    [[chat.workday.runs.definition.nodes.choices]]
                    action = 'decline_offer'
                    id = 'decline-after-scope'
                    next = 'manual'
                    text = 'I will keep handling things manually for now.'

                [[chat.workday.runs.definition.nodes]]
                check = 'delegation_pending'
                check_value = false
                id = 'review-wait'
                kind = 'wait'
                next = 'review-result'

                [[chat.workday.runs.definition.nodes]]
                check = 'delegated'
                id = 'review-result'
                kind = 'condition'
                on_false = 'not-approved'
                on_true = 'approved'

                [[chat.workday.runs.definition.nodes]]
                id = 'approved'
                kind = 'end'
                text = 'The responsibility is active. Watch the AI view for routine work and exceptions. Sending a document still needs acknowledgement before it counts as success.'

                [[chat.workday.runs.definition.nodes]]
                id = 'not-approved'
                kind = 'end'
                text = 'I am not authorizing that scope now. The review message explains why. Keep helping manually; further demonstrated work may change my decision.'

                [[chat.workday.runs.definition.nodes]]
                id = 'manual'
