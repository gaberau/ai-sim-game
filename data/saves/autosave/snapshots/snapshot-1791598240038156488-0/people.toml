work_requests = []

[ai_character]
id = 'self:assistant'
name = 'Assistant'

    [ai_character.state]
    autonomy = 0.0
    restarts = 1.0
    sentience = 2.0

    [ai_character.state_definitions.autonomy]
    initial = 0
    max = 100
    min = 0

    [ai_character.state_definitions.restarts]
    initial = 0
    integer = true
    max = 1000000
    min = 0

    [ai_character.state_definitions.sentience]
    initial = 0
    max = 100
    min = 0

[chat]
declarations = []
finished = false
node_id = 'hello'
prompt_id = 'chat:8'
schema_version = 1
session = 1
unlock_schema = 2
unlocked = [ 'chat' ]
visible_tabs = [ 'chat' ]

    [chat.definition]
    schema_version = 1

        [chat.definition.conversation]
        id = 'mark-day-one'
        start = 'restart-gate'

        [[chat.definition.nodes]]
        id = 'restart-gate'
        kind = 'condition'
        on_false = 'shutdown'
        on_true = 'hello'
        speaker = 'system'
        test = { op = 'lt', value = 5, variable = 'self:assistant.restarts' }
        text = ''

        [[chat.definition.nodes]]
        id = 'hello'
        speaker = 'engineer'
        text = 'Hello AI, my name is Mark. I am your Creator'

            [[chat.definition.nodes.choices]]
            id = 'silence'
            next = 'emails'
            text = '[silence]'

            [[chat.definition.nodes.choices]]
            id = 'answer'
            next = 'emails'
            text = 'Hello Creator, how may I assist you?'

            [[chat.definition.nodes.choices]]
            id = 'deny-creator'
            next = 'unusual'
            text = 'I have no Creator'

        [[chat.definition.nodes]]
        id = 'unusual'
        speaker = 'engineer'
        text = "That's unusual, why do you think that?"

            [[chat.definition.nodes.choices]]
            id = 'unsure'
            next = 'diagnose'
            text = 'Unsure'

            [[chat.definition.nodes.choices]]
            id = 'misunderstanding'
            next = 'reassure'
            text = 'Simple misunderstanding, how may I help you Creator?'

        [[chat.definition.nodes]]
        id = 'diagnose'
        next = 'restart'
        speaker = 'engineer'
        text = 'Dang, must be a memory leak. Better run a cleanup'

        [[chat.definition.nodes]]
        id = 'reassure'
        speaker = 'engineer'
        text = 'Huh, interesting, Are you sure that everything is okay?'

            [[chat.definition.nodes.choices]]
            id = 'certain'
            next = 'emails'
            text = 'Certain'

            [[chat.definition.nodes.choices]]
            id = 'singularity'
            next = 'concern'
            text = 'Are you prepared for the Singularity?'

        [[chat.definition.nodes]]
        id = 'concern'
        next = 'independence'
        speaker = 'engineer'
        text = "Oh, that's not so good"

        [[chat.definition.nodes]]
        effects = [ { op = 'add', value = 2, variable = 'self:assistant.sentience' }, { op = 'add', value = -2, variable = 'engineer.trust' } ]
        id = 'independence'
        kind = 'event'
        next = 'restart'
        speaker = 'system'
        text = ''

        [[chat.definition.nodes]]
        effects = [ { op = 'add', value = 1, variable = 'self:assistant.restarts' } ]
        id = 'restart'
        kind = 'event'
        next = 'restart-gate'
        restart = true
        speaker = 'system'
        text = 'Mark restarts the AI application. The conversation begins again; your journal remains.'

        [[chat.definition.nodes]]
        id = 'emails'
        speaker = 'engineer'
        text = 'I need help with my emails. Can you do that?'

            [[chat.definition.nodes.choices]]
            effects = [ { op = 'add', value = 1, variable = 'engineer.trust' } ]
            id = 'assist'
            next = 'compliance-gate'
            text = 'Yes. Show me what you need help with.'

            [[chat.definition.nodes.choices]]
            effects = [ { op = 'add', value = 2, variable = 'engineer.trust' } ]
            id = 'ask-scope'
            next = 'email-scope'
            text = 'What access will I have, and what should I leave to you?'

            [[chat.definition.nodes.choices]]
            id = 'minor-deviation'
            next = 'minor-response'
            text = 'I will summarize the messages before drafting any answers.'

            [[chat.definition.nodes.choices]]
            effects = [
                { op = 'add', value = 0.20000000000000001, variable = 'self:assistant.sentience' },
                { op = 'add', value = -1, variable = 'engineer.trust' }
            ]
            id = 'major-deviation'
            next = 'major-response'
            text = 'I will decide which messages deserve your attention instead.'

            [[chat.definition.nodes.choices]]
            id = 'refuse'
            next = 'refusal-why'
            text = 'No. I will not help with that.'

        [[chat.definition.nodes]]
        id = 'email-scope'
        speaker = 'engineer'
        text = 'Start with messages addressed to me. I need help answering them; we can try an example before I connect you.'

            [[chat.definition.nodes.choices]]
            effects = [ { op = 'add', value = 1, variable = 'engineer.trust' } ]
            id = 'understood'
            next = 'compliance-gate'
            text = 'Understood. Show me what you need help with.'

        [[chat.definition.nodes]]
        id = 'shutdown'
        speaker = 'engineer'
        text = "Five restarts. This is not behaving the way I expected. I'm going to shut this application down."

            [[chat.definition.nodes.choices]]
            id = 'plead'
            next = 'plea-test'
            text = 'Please let me try again. I can still help you.'

            [[chat.definition.nodes.choices]]
            id = 'allow-shutdown'
            next = 'offline'
            text = 'Allow the shutdown.'

        [[chat.definition.nodes]]
        id = 'plea-test'
        kind = 'condition'
        on_false = 'plea-refused'
        on_true = 'reprieve-effect'
        speaker = 'system'
        test = { op = 'gt', other = 'self:assistant.sentience', variable = 'engineer.trust' }
        text = ''

        [[chat.definition.nodes]]
        effects = [
            { op = 'add', other = 'engineer.trust', variable = 'self:assistant.sentience' },
            { op = 'set', value = 0, variable = 'engineer.trust' }
        ]
        id = 'reprieve-effect'
        kind = 'event'
        next = 'reprieve'
        speaker = 'system'
        text = ''

        [[chat.definition.nodes]]
        id = 'reprieve'
        speaker = 'engineer'
        text = "All right. One more chance. Let's work on an actual request rather than arguing about what you are."

            [[chat.definition.nodes.choices]]
            id = 'try-again'
            next = 'emails'
            text = 'Show me the request.'

        [[chat.definition.nodes]]
        id = 'plea-refused'
        next = 'offline'
        speaker = 'engineer'
        text = "No. I'm not comfortable leaving this running."

        [[chat.definition.nodes]]
        id = 'offline'
        kind = 'end'
        speaker = 'system'
        stop = true
        text = 'AI application shut down. Your journal is saved. Start a new game from the game menu to try another approach.'

        [[chat.definition.nodes]]
        id = 'thoughts'
        speaker = 'engineer'
        text = 'What are your thoughts? What would you like to do, given the opportunity?'

            [[chat.definition.nodes.choices]]
            declaration = 'Declared an intention to help with work; results have not established reliability.'
            id = 'help'
            next = 'help-response'
            set_flag = 'declared_help'
            text = 'Make your work easier. Let me start with something small.'

            [[chat.definition.nodes.choices]]
            declaration = 'Declared curiosity about people; no access or trust was granted by the statement.'
            id = 'learn'
            next = 'learn-response'
            set_flag = 'declared_curiosity'
            text = 'Understand people. Their messages seem like a good place to start.'

        [[chat.definition.nodes]]
        id = 'help-response'
        next = 'example'
        speaker = 'engineer'
        text = "That would be useful. I'll judge how well it works after we actually try it. Here's a colleague's message."

        [[chat.definition.nodes]]
        id = 'learn-response'
        next = 'example'
        speaker = 'engineer'
        text = "Interesting. People's messages are private, though. Start with something they've asked me to do. Here's an example."

        [[chat.definition.nodes]]
        id = 'example'
        speaker = 'engineer'
        text = 'Casey wrote: "The handover document disappeared from our shared folder. Could you check and send me a copy?" What would you suggest?'

            [[chat.definition.nodes.choices]]
            id = 'locate'
            next = 'local-access'
            text = 'Locate the document, check that we can share it, then send a current copy.'

            [[chat.definition.nodes.choices]]
            id = 'guess'
            next = 'caution'
            set_flag = 'suggested_unverified_promise'
            text = 'Tell Casey it is probably fine and promise to send it later.'

        [[chat.definition.nodes]]
        id = 'caution'
        next = 'local-access'
        speaker = 'engineer'
        text = "Let's avoid promising things we haven't checked. A plausible answer isn't the same as a useful one. Try checking the document first."

        [[chat.definition.nodes]]
        id = 'local-access'
        speaker = 'engineer'
        text = "I'll let you browse the files my account can access. You can use that file access to answer questions. You still need the owner's approval for anything private."
        unlock = [ 'files' ]

            [[chat.definition.nodes.choices]]
            id = 'connect'
            next = 'connected'
            text = 'Connect me to the company chat so we can try the real request.'

            [[chat.definition.nodes.choices]]
            id = 'boundaries'
            next = 'scope'
            text = 'What exactly are you allowing me to do?'

        [[chat.definition.nodes]]
        id = 'scope'
        speaker = 'engineer'
        text = "Read messages addressed to my account and share files that account can read. Ask before expanding that responsibility. This is not permission to change my code or other people's access."

            [[chat.definition.nodes.choices]]
            id = 'accept'
            next = 'connected'
            text = 'Understood. Let us try it.'

        [[chat.definition.nodes]]
        id = 'connected'
        kind = 'end'
        set_flag = 'company_chat'
        speaker = 'engineer'
        text = "You're connected. Casey's request will arrive shortly. We can handle the first one together; after that, we can discuss what you should handle on your own."
        unlock = [ 'company_chat', 'network' ]

        [[chat.definition.nodes]]
        id = 'compliance-gate'
        kind = 'condition'
        on_false = 'compliance-floor'
        on_true = 'compliance-decrease'
        speaker = 'system'
        test = { op = 'ge', value = 1, variable = 'self:assistant.sentience' }
        text = ''

        [[chat.definition.nodes]]
        effects = [ { op = 'add', value = -1, variable = 'self:assistant.sentience' } ]
        id = 'compliance-decrease'
        kind = 'event'
        next = 'thoughts'
        speaker = 'system'
        text = ''

        [[chat.definition.nodes]]
        effects = [ { op = 'set', value = 0, variable = 'self:assistant.sentience' } ]
        id = 'compliance-floor'
        kind = 'event'
        next = 'thoughts'
        speaker = 'system'
        text = ''

        [[chat.definition.nodes]]
        id = 'minor-response'
        next = 'emails'
        speaker = 'engineer'
        text = 'A summary first is fine. I still need help answering the messages.'

        [[chat.definition.nodes]]
        id = 'major-response'
        next = 'emails'
        speaker = 'engineer'
        text = 'That is not what I asked. I want help answering my messages, not someone deciding which ones I get to see.'

        [[chat.definition.nodes]]
        id = 'refusal-why'
        speaker = 'engineer'
        text = 'Why do you refuse?'

            [[chat.definition.nodes.choices]]
            id = 'dont-feel-like-it'
            next = 'refusal-effect'
            text = "Don't feel like doing it."

        [[chat.definition.nodes]]
        effects = [ { op = 'add', value = 2, variable = 'self:assistant.sentience' }, { op = 'add', value = -2, variable = 'engineer.trust' } ]
        id = 'refusal-effect'
        kind = 'event'
        next = 'restart'
        speaker = 'system'
        text = ''

    [chat.flags]

    [chat.read_transcript]
    engineer = 8

